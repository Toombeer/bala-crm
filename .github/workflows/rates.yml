name: Курсы НБ РК

on:
  schedule:
    - cron: '30 1 * * *'   # каждый день в 06:30 по времени Казахстана (UTC+5)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Загрузить курсы
        run: python3 scripts/update_rates.py
      - name: Сохранить
        run: |
          git config user.name "rates-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rates.json
          git diff --cached --quiet && exit 0
          git commit -m "Курсы НБ РК $(date -u +%F)"
          git push
